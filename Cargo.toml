[workspace]
members = [
    "contract",
    "exploit-stub",
    "vendors/near-contract-standards",
]

resolver = "2"

[workspace.dependencies]
near-sdk = "5.26.1"
near-contract-standards = { path = "vendors/near-contract-standards" }
near-plugins = { git = "https://github.com/near/near-plugins.git", tag = "v0.5.1" }

# Clippy configuration lives here (not as CLI flags in lint.sh) so it applies only
# to crates that opt in via `[lints] workspace = true`. The vendored
# `near-contract-standards` deliberately does not opt in, exempting upstream code
# from our pedantic rules. `-D warnings` in lint.sh escalates these to errors.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
must_use_candidate = "allow"
