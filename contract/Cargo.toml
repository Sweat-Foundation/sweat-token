[package]
name = "contract"
version = "1.3.0"
authors = []
edition = "2021"
publish = false
repository = "https://github.com/Sweat-Foundation/sweat-token"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.19.0-rust-1.86.0"
image_digest = "sha256:772638e343baeeea24e49062c7d424274f3441452cc06ce97fc4e5695b19fecc"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib"]

[features]
default = []
integration-test = []

[dependencies]
static_assertions = "1.1.0"
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }
near-plugins = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

[lints]
workspace = true
